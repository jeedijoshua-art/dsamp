name: FraudGraph CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  engine-tests:
    name: C++17 Engine Compilation & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install C++17 Compiler & Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++ make

      - name: Compile C++17 Core Engine
        run: |
          make -C engine clean
          make -C engine all

      - name: Execute C++ Automated Unit Tests (92 Assertions)
        run: |
          make -C engine test

  integration-tests:
    name: Backend API Bridge & Dataset Integration Tests
    runs-on: ubuntu-latest
    needs: engine-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install C++17 Compiler & Compile Engine Binary
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++ make
          make -C engine all

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci || npm install

      - name: Start Express Backend Server
        run: |
          cd backend
          node src/server.js &
          sleep 3

      - name: Run End-to-End API Regression Suite
        run: node test_e2e.js

      - name: Run All 5 Datasets Catalog Test Suite
        run: node test_all_datasets.js

      - name: Run Custom Investigation Lab Regression Suite
        run: node test_custom_lab.js

  frontend-build:
    name: Frontend TypeScript Verification & Vite Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Build Frontend Production Bundle (tsc && vite build)
        run: |
          cd frontend
          npm run build
